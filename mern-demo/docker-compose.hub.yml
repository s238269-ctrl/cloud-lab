services:
  backend:
    image: s238269/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
  frontend:
    image: s238269/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "3000:3000"
