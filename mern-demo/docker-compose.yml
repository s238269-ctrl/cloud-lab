services:
  backend:
    build: ./server
    container_name: mern-backend
    network_mode: host
    env_file:
      - ./.env

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "3000:3000"
    networks:
      - mern-network

networks:
  mern-network:
    external: true